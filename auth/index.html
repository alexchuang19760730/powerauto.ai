<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — PowerAuto.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--text:#a0a0b8;--heading:#f0f0ff;--accent:#6c5ce7;--accent2:#00cec9;--gradient:linear-gradient(135deg,#6c5ce7,#00cec9);--error:#ff6b6b;--success:#51cf66}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
a{color:var(--accent2);text-decoration:none}

/* Container */
.auth-container{width:100%;max-width:420px;position:relative}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;position:relative;z-index:1}
.auth-card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;background:var(--gradient);border-radius:2px}

/* Logo */
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo .logo-text{font-size:1.5rem;font-weight:700;color:var(--heading)}
.auth-logo .logo-text span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{font-size:.85rem;color:var(--text);margin-top:.3rem}

/* Tabs */
.auth-tabs{display:flex;margin-bottom:1.5rem;background:var(--bg);border-radius:10px;padding:3px}
.auth-tab{flex:1;padding:.6rem;text-align:center;font-size:.9rem;font-weight:500;color:var(--text);border:none;background:transparent;cursor:pointer;border-radius:8px;transition:all .2s}
.auth-tab.active{background:var(--card);color:var(--heading);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* Form */
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;font-weight:500;color:var(--text);margin-bottom:.4rem}
.form-group input{width:100%;padding:.7rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--heading);font-size:.9rem;transition:border-color .2s}
.form-group input:focus{outline:none;border-color:var(--accent)}
.form-group input::placeholder{color:#555}

/* Name field (register only) */
.name-field{display:none}
.name-field.show{display:block}

/* Buttons */
.btn{width:100%;padding:.75rem;border-radius:10px;font-size:.95rem;font-weight:600;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;margin-top:.5rem}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 4px 15px rgba(108,92,231,.3)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(108,92,231,.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:transparent;color:var(--heading);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent)}

/* Divider */
.divider{display:flex;align-items:center;margin:1.5rem 0;gap:1rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:.8rem;color:var(--text);white-space:nowrap}

/* OAuth buttons */
.oauth-buttons{display:flex;gap:.8rem}
.oauth-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;font-weight:500;cursor:pointer;transition:border-color .2s}
.oauth-btn:hover{border-color:var(--accent);color:var(--heading)}
.oauth-btn svg{width:18px;height:18px}

/* Error/Success */
.message{padding:.6rem 1rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem;display:none}
.message.error{display:block;background:rgba(255,107,107,.1);color:var(--error);border:1px solid rgba(255,107,107,.2)}
.message.success{display:block;background:rgba(81,207,102,.1);color:var(--success);border:1px solid rgba(81,207,102,.2)}

/* Loading */
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.auth-footer{text-align:center;margin-top:1.5rem;font-size:.8rem;color:var(--text)}
.auth-footer a{color:var(--accent2)}

/* Back link */
.back-link{position:absolute;top:-2.5rem;left:0;color:var(--text);font-size:.85rem;display:flex;align-items:center;gap:.3rem}
.back-link:hover{color:var(--heading)}

/* Password toggle */
.pw-wrapper{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text);cursor:pointer;font-size:.8rem}

/* Role badges (for demo) */
.role-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600}
.role-badge.super_admin{background:rgba(255,107,107,.15);color:#ff6b6b}
.role-badge.admin{background:rgba(108,92,231,.15);color:#6c5ce7}
.role-badge.user{background:rgba(0,206,201,.15);color:#00cec9}
</style>
</head>
<body>

<div class="auth-container">
  <a href="../" class="back-link">← 返回首页</a>
  
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-text">⚡ <span>PowerAuto</span>.ai</div>
      <p id="authSubtitle">登录您的账户</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" onclick="switchTab('register')">注册</button>
    </div>

    <!-- Error/Success Message -->
    <div id="authMessage" class="message"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="pw-wrapper">
          <input type="password" id="loginPassword" placeholder="••••••••" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">显示</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">登录</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group name-field show">
        <label>显示名称</label>
        <input type="text" id="regName" placeholder="您的名字">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" id="regEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="pw-wrapper">
          <input type="password" id="regPassword" placeholder="至少 6 位" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">显示</button>
        </div>
      </div>
      <div class="form-group">
        <label>确认密码</label>
        <div class="pw-wrapper">
          <input type="password" id="regPassword2" placeholder="再输入一次" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePw('regPassword2', this)">显示</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="regBtn">创建账户</button>
    </form>

    <!-- Divider -->
    <div class="divider"><span>或</span></div>

    <!-- OAuth -->
    <div class="oauth-buttons">
      <button class="oauth-btn" onclick="handleOAuth('github')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </button>
      <button class="oauth-btn" onclick="handleOAuth('google')">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
    </div>

    <div class="auth-footer">
      <p id="authFooterText">还没有账户？<a href="#" onclick="switchTab('register')">立即注册</a></p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ============================================================
// Tab switching
// ============================================================
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('authSubtitle').textContent = tab === 'login' ? '登录您的账户' : '创建新账户';
  document.getElementById('authFooterText').innerHTML = tab === 'login'
    ? '还没有账户？<a href="#" onclick="switchTab(\'register\')">立即注册</a>'
    : '已有账户？<a href="#" onclick="switchTab(\'login\')">立即登录</a>';
  hideMessage();
}

// ============================================================
// Messages
// ============================================================
function showMessage(text, type) {
  const el = document.getElementById('authMessage');
  el.textContent = text;
  el.className = 'message ' + type;
}
function hideMessage() {
  document.getElementById('authMessage').className = 'message';
}

// ============================================================
// Password toggle
// ============================================================
function togglePw(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '隐藏';
  } else {
    input.type = 'password';
    btn.textContent = '显示';
  }
}

// ============================================================
// Login
// ============================================================
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');

  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>';
  hideMessage();

  try {
    const { data, error } = await Auth.signIn(email, password);
    if (error) throw error;

    // 获取 profile
    const profile = await Auth.getProfile(data.user.id);
    if (profile) {
      // 根据角色跳转
      if (profile.role === 'super_admin') {
        window.location.href = '../admin/';
      } else {
        window.location.href = '../space/';
      }
    } else {
      window.location.href = '../space/';
    }
  } catch (err) {
    showMessage(err.message || '登录失败，请检查邮箱和密码', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

// ============================================================
// Register
// ============================================================
async function handleRegister(e) {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;
  const btn = document.getElementById('regBtn');

  if (password !== password2) {
    showMessage('两次输入的密码不一致', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>';
  hideMessage();

  try {
    const { data, error } = await Auth.signUp(email, password, name);
    if (error) throw error;

    if (data.user && !data.session) {
      showMessage('注册成功！请查收邮箱确认链接，然后登录。', 'success');
      setTimeout(() => switchTab('login'), 3000);
    } else {
      window.location.href = '../space/';
    }
  } catch (err) {
    showMessage(err.message || '注册失败，请稍后重试', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '创建账户';
  }
}

// ============================================================
// OAuth
// ============================================================
async function handleOAuth(provider) {
  hideMessage();
  try {
    if (provider === 'github') {
      await Auth.signInWithGitHub();
    } else if (provider === 'google') {
      await Auth.signInWithGoogle();
    }
  } catch (err) {
    showMessage(err.message || 'OAuth 登录失败', 'error');
  }
}

// ============================================================
// 已登录则跳转
// ============================================================
(async () => {
  if (typeof Auth === 'undefined') {
    showMessage('⚠️ Supabase 未配置，请先设置 auth/config.js', 'error');
    return;
  }
  const user = await Auth.getUser();
  if (user) {
    const profile = await Auth.getProfile(user.id);
    if (profile?.role === 'super_admin') {
      window.location.href = '../admin/';
    } else {
      window.location.href = '../space/';
    }
  }
})();
</script>
</body>
</html>
