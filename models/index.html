<style>
:root{--bg:#0a0a0f;--bg2:#0f0f18;--card:#14141f;--card2:#1a1a28;--border:#1e1e30;--border2:#2a2a40;--text:#8888a0;--text2:#a0a0b8;--heading:#f0f0ff;--accent:#6c5ce7;--accent2:#00cec9;--accent3:#fd79a8;--gradient:linear-gradient(135deg,#6c5ce7,#00cec9);--gradient2:linear-gradient(135deg,#fd79a8,#6c5ce7);--success:#00b894;--warning:#fdcb6e;--danger:#e17055;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text2);line-height:1.6;overflow-x:hidden}
a{color:var(--accent2);text-decoration:none;transition:color .2s}
a:hover{color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-size:1.2rem;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:.5rem;text-decoration:none}
.logo span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center}
.nav-links a{color:var(--text);font-size:.85rem;font-weight:500;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--heading)}
.nav-right{display:flex;align-items:center;gap:1rem}
.btn-sm{padding:.4rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-gradient{background:var(--gradient);color:#fff}
.btn-gradient:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(108,92,231,.4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--heading)}

/* Hero */
.hero-mini{padding:5rem 2rem 2rem;text-align:center;position:relative}
.hero-mini::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(circle,rgba(108,92,231,.1) 0%,transparent 70%);pointer-events:none}
.hero-mini h1{font-size:2.2rem;font-weight:800;color:var(--heading);margin-bottom:.5rem;position:relative}
.hero-mini h1 em{font-style:normal;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-mini p{font-size:1rem;color:var(--text);max-width:600px;margin:0 auto;position:relative}

/* Search */
.search-bar{max-width:640px;margin:1.5rem auto;position:relative}
.search-bar input{width:100%;padding:.8rem 1.2rem .8rem 3rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--heading);font-size:.95rem;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text)}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text);font-size:1.1rem}

/* Tabs */
.tabs{display:flex;justify-content:center;gap:.5rem;margin:1.5rem 0;flex-wrap:wrap}
.tab{padding:.4rem 1rem;border-radius:20px;font-size:.8rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;transition:all .2s}
.tab:hover,.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Model Grid */
.container{max-width:1200px;margin:0 auto;padding:0 2rem}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;margin:1rem 0 3rem}
.model-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.model-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.model-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.8rem}

.model-icon.minimax{background:linear-gradient(135deg,#fa709a,#fee140)}
.model-icon.llama{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}
.model-badges{display:flex;gap:.3rem;flex-wrap:wrap}

.badge-mtp{background:rgba(108,92,231,.2);color:var(--accent)}
.badge-q4{background:rgba(0,206,201,.2);color:var(--accent2)}
.badge-iq3{background:rgba(253,121,168,.2);color:var(--accent3)}
.badge-free{background:rgba(0,184,148,.2);color:var(--success)}

.model-desc{font-size:.8rem;color:var(--text);margin-bottom:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.model-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--text)}
.model-meta span{display:flex;align-items:center;gap:.3rem}
.model-actions{display:flex;gap:.5rem;margin-top:.8rem}

.stats-bar{display:flex;justify-content:center;gap:3rem;padding:1.5rem 0;border-bottom:1px solid var(--border);margin-bottom:1rem}

function renderModels(models) {
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = models.map(m => `
    <div class="model-card" onclick="window.location.href='detail.html?id=${m.id}'">
      <div class="model-card-header">
        <div class="model-icon ${m.family}">${m.icon}</div>
        <div class="model-badges">
          ${m.tags.map(t => `<span class="badge badge-${t}">${t.toUpperCase()}</span>`).join('')}
          ${m.cloud ? '<span class="badge badge-cloud">☁️ Cloud</span>' : ''}
        </div>
      </div>
      <div class="model-name">${m.name}</div>
      <div class="model-desc">${m.desc}</div>
      <div class="model-meta">
        <span>📊 ${m.params}</span>
        <span>📦 ${m.size}</span>
        <span>📐 ${m.context}</span>
      </div>
      <div class="model-meta" style="margin-top:.3rem">
        <span>⬇️ ${m.downloads.toLocaleString()}</span>
        <span>❤️ ${m.likes}</span>
        <span>📄 ${m.license}</span>
      </div>
      <div class="model-actions">
        <a href="playground.html?id=${m.id}" class="btn-action btn-play" onclick="event.stopPropagation()">🎮 在线试用</a>
        <a href="detail.html?id=${m.id}" class="btn-action btn-download" onclick="event.stopPropagation()">📥 下载</a>
      </div>
    </div>
  `).join('');
}

function filterCategory(cat, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const filtered = cat === 'all' ? MODELS : MODELS.filter(m => m.family === cat);
  renderModels(filtered);
}

function filterModels() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = MODELS.filter(m =>
    m.name.toLowerCase().includes(q) ||
    m.desc.toLowerCase().includes(q) ||
    m.family.toLowerCase().includes(q)
  );
  renderModels(filtered);
}
