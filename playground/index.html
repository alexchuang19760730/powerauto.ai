<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线试用 — PowerAuto Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#0f0f18;--card:#14141f;--card2:#1a1a28;--border:#1e1e30;--border2:#2a2a40;--text:#8888a0;--text2:#a0a0b8;--heading:#f0f0ff;--accent:#6c5ce7;--accent2:#00cec9;--gradient:linear-gradient(135deg,#6c5ce7,#00cec9);--success:#00b894;--warning:#fdcb6e;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text2);line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent2);text-decoration:none}a:hover{color:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.5rem;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar .logo{font-size:1rem;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:.4rem;text-decoration:none}
.topbar .logo span{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-center{display:flex;align-items:center;gap:.8rem}
.topbar-center select{background:var(--card2);color:var(--heading);border:1px solid var(--border);border-radius:8px;padding:.3rem .8rem;font-size:.8rem;outline:none;cursor:pointer}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.online{background:var(--success);box-shadow:0 0 8px var(--success)}
.status-dot.offline{background:#e17055}
.status-text{font-size:.75rem;color:var(--text)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:1rem;border-bottom:1px solid var(--border)}
.sidebar-header h3{font-size:.85rem;color:var(--heading);margin-bottom:.5rem}
.backend-tabs{display:flex;gap:.3rem;margin-bottom:.8rem}
.backend-tab{flex:1;padding:.4rem;border-radius:6px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;text-align:center;transition:all .2s}
.backend-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.server-input{display:flex;gap:.4rem;margin-bottom:.5rem}
.server-input input{flex:1;background:var(--bg);color:var(--heading);border:1px solid var(--border);border-radius:6px;padding:.35rem .6rem;font-size:.75rem;font-family:'JetBrains Mono',monospace;outline:none}
.server-input input:focus{border-color:var(--accent)}
.server-input button{background:var(--gradient);color:#fff;border:none;border-radius:6px;padding:.35rem .8rem;font-size:.75rem;cursor:pointer;white-space:nowrap}
.cloud-models{margin-top:.5rem}
.cloud-model{padding:.4rem .6rem;border-radius:6px;font-size:.75rem;color:var(--text2);cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:.2rem}
.cloud-model:hover{background:var(--card2);border-color:var(--border)}
.cloud-model.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cloud-model .speed{float:right;font-size:.65rem;color:var(--success)}
.sidebar-section{padding:1rem;border-bottom:1px solid var(--border)}
.sidebar-section h4{font-size:.75rem;color:var(--text);text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}
.param-row{display:flex;justify-content:space-between;align-items:center;margin:.4rem 0}
.param-row label{font-size:.8rem;color:var(--text2)}
.param-row input[type=range]{width:120px;accent-color:var(--accent)}
.param-row .val{font-size:.75rem;color:var(--accent2);min-width:30px;text-align:right;font-family:'JetBrains Mono',monospace}
.param-row select{background:var(--card2);color:var(--heading);border:1px solid var(--border);border-radius:4px;padding:.2rem .4rem;font-size:.75rem;outline:none}
.sidebar-footer{margin-top:auto;padding:1rem;border-top:1px solid var(--border)}
.btn-full{width:100%;padding:.5rem;border-radius:8px;font-size:.85rem;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--gradient);color:#fff}.btn-primary:hover{box-shadow:0 4px 16px rgba(108,92,231,.4)}
.btn-danger{background:transparent;color:#e17055;border:1px solid #e1705533}.btn-danger:hover{background:#e1705520}
.new-chat{background:var(--card2);color:var(--text2);border:1px solid var(--border);margin-bottom:.5rem}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.msg{max-width:80%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-bubble{padding:.8rem 1.2rem;border-radius:12px;font-size:.9rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .msg-bubble{background:var(--card);color:var(--text2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-meta{font-size:.65rem;color:var(--text);margin-top:.2rem;padding:0 .3rem}
.msg.user .msg-meta{text-align:right}
.typing{display:flex;gap:4px;padding:.8rem 1.2rem}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.welcome h2{font-size:1.5rem;color:var(--heading);margin-bottom:.5rem}
.welcome p{font-size:.9rem;color:var(--text);max-width:500px;margin-bottom:1.5rem}
.quick-actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.quick-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.5rem 1rem;font-size:.8rem;color:var(--text2);cursor:pointer;transition:all .2s}
.quick-btn:hover{border-color:var(--accent);color:var(--heading)}
.input-area{padding:1rem 1.5rem;border-top:1px solid var(--border);background:var(--card)}
.input-wrapper{display:flex;gap:.5rem;align-items:flex-end;max-width:800px;margin:0 auto}
.input-wrapper textarea{flex:1;background:var(--bg);color:var(--heading);border:1px solid var(--border);border-radius:10px;padding:.6rem 1rem;font-size:.9rem;font-family:inherit;resize:none;outline:none;max-height:120px;line-height:1.5}
.input-wrapper textarea:focus{border-color:var(--accent)}
.input-wrapper textarea::placeholder{color:var(--text)}
.send-btn{background:var(--gradient);color:#fff;border:none;border-radius:10px;width:42px;height:42px;font-size:1.1rem;cursor:pointer;transition:all .2s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(108,92,231,.4)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.input-hint{font-size:.7rem;color:var(--text);text-align:center;margin-top:.4rem;max-width:800px;margin-left:auto;margin-right:auto}
.token-stats{display:flex;gap:1rem;justify-content:center;padding:.3rem;font-size:.7rem;color:var(--text)}
.token-stats span{display:flex;align-items:center;gap:.3rem}
.badge-cloud{background:rgba(253,203,110,.15);color:var(--warning);padding:.1rem .4rem;border-radius:3px;font-size:.6rem;font-weight:600}
.badge-free{background:rgba(0,184,148,.15);color:var(--success);padding:.1rem .4rem;border-radius:3px;font-size:.6rem;font-weight:600}
@media(max-width:768px){.sidebar{display:none}.msg{max-width:95%}}
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="logo">⚡ <span>PowerAuto</span></a>
  <div class="topbar-center">
    <span id="statusDot" class="status-dot offline"></span>
    <span id="statusText" class="status-text">未连接</span>
    <select id="modelSelect"></select>
  </div>
  <div style="display:flex;align-items:center;gap:.8rem">
    <a href="../models/index.html" style="font-size:.8rem">模型市场</a>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>🔗 推理后端</h3>
      <div class="backend-tabs">
        <button class="backend-tab active" onclick="switchBackend('cloud',this)">☁️ 云端免费</button>
        <button class="backend-tab" onclick="switchBackend('local',this)">💻 本地服务</button>
      </div>

      <!-- Cloud backend -->
      <div id="cloudPanel">
        <div class="cloud-models" id="cloudModels"></div>
      </div>

      <!-- Local backend -->
      <div id="localPanel" style="display:none">
        <div class="server-input">
          <input type="text" id="serverUrl" value="http://localhost:8080" placeholder="服务地址">
          <button onclick="checkLocalHealth()">连接</button>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <h4>⚙️ 生成参数</h4>
      <div class="param-row">
        <label>Temperature</label>
        <input type="range" id="temp" min="0" max="2" step="0.1" value="0.7" oninput="document.getElementById('tempVal').textContent=this.value">
        <span class="val" id="tempVal">0.7</span>
      </div>
      <div class="param-row">
        <label>Max Tokens</label>
        <input type="range" id="maxTokens" min="16" max="2048" step="16" value="512" oninput="document.getElementById('maxVal').textContent=this.value">
        <span class="val" id="maxVal">512</span>
      </div>
      <div class="param-row">
        <label>Top P</label>
        <input type="range" id="topP" min="0" max="1" step="0.05" value="0.9" oninput="document.getElementById('topPVal').textContent=this.value">
        <span class="val" id="topPVal">0.9</span>
      </div>
    </div>

    <div class="sidebar-section">
      <h4>📝 System Prompt</h4>
      <textarea id="systemPrompt" style="width:100%;background:var(--bg);color:var(--heading);border:1px solid var(--border);border-radius:6px;padding:.4rem;font-size:.75rem;height:60px;resize:vertical;outline:none;font-family:inherit" placeholder="You are a helpful assistant.">You are a helpful assistant.</textarea>
    </div>

    <div class="sidebar-footer">
      <button class="btn-full new-chat" onclick="newChat()">+ 新对话</button>
      <button class="btn-full btn-danger" onclick="clearChat()">🗑️ 清空对话</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome">
        <h2>🎮 PowerAuto Playground</h2>
        <p>选择云端免费模型或连接本地服务，实时体验大模型对话。</p>
        <div class="quick-actions">
          <button class="quick-btn" onclick="sendQuick('用一句话介绍你自己')">👋 自我介绍</button>
          <button class="quick-btn" onclick="sendQuick('写一个 Python 快速排序算法')">💻 写代码</button>
          <button class="quick-btn" onclick="sendQuick('解释什么是 MoE 架构')">📚 解释概念</button>
          <button class="quick-btn" onclick="sendQuick('帮我写一封商务邮件')">✉️ 写邮件</button>
          <button class="quick-btn" onclick="sendQuick('1+1等于几？')">🧮 算数</button>
        </div>
      </div>
    </div>
    <div class="token-stats" id="tokenStats" style="display:none">
      <span>⏱️ <span id="statTime">0s</span></span>
      <span>📊 <span id="statTps">0</span> tok/s</span>
      <span>📥 <span id="statPrompt">0</span> prompt</span>
      <span>📤 <span id="statCompletion">0</span> completion</span>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
      </div>
      <div class="input-hint" id="inputHint">☁️ 云端免费模型 · 无需部署 · 即开即用</div>
    </div>
  </div>
</div>

<script>
// ============ Cloud Models (Free HF Inference) ============
const CLOUD_MODELS = [
  { id: "Qwen/Qwen3-0.6B", name: "Qwen3-0.6B", desc: "超轻量，秒级响应", speed: "~50 tok/s", tags: ["free","fast"] },
  { id: "Qwen/Qwen3-1.7B", name: "Qwen3-1.7B", desc: "轻量级，平衡速度与质量", speed: "~40 tok/s", tags: ["free"] },
  { id: "Qwen/Qwen3-4B", name: "Qwen3-4B", desc: "端侧旗舰，质量优秀", speed: "~30 tok/s", tags: ["free"] },
  { id: "Qwen/Qwen3-8B", name: "Qwen3-8B", desc: "中等规模，能力强", speed: "~20 tok/s", tags: ["free"] },
  { id: "meta-llama/Llama-3.1-8B-Instruct", name: "Llama-3.1-8B", desc: "Meta 开源旗舰 8B", speed: "~25 tok/s", tags: ["free"] },
  { id: "google/gemma-2-9b-it", name: "Gemma-2-9B", desc: "Google 多模态 9B", speed: "~22 tok/s", tags: ["free"] },
  { id: "microsoft/Phi-3.5-mini-instruct", name: "Phi-3.5-Mini", desc: "微软小模型，代码能力强", speed: "~45 tok/s", tags: ["free","fast"] },
  { id: "HuggingFaceH4/zephyr-7b-beta", name: "Zephyr-7B", desc: "Mistral 微调，对话流畅", speed: "~20 tok/s", tags: ["free"] },
];

let backend = "cloud";
let selectedCloudModel = CLOUD_MODELS[0].id;
let messages = [];
let isGenerating = false;
let localServerUrl = "";

// ============ Init ============
function init() {
  renderCloudModels();
  // Check URL params
  const params = new URLSearchParams(window.location.search);
  const modelId = params.get('id');
  if (modelId) {
    const found = CLOUD_MODELS.find(m => m.id.toLowerCase().includes(modelId.toLowerCase()));
    if (found) {
      selectedCloudModel = found.id;
      renderCloudModels();
    }
  }
}

function renderCloudModels() {
  const container = document.getElementById('cloudModels');
  container.innerHTML = CLOUD_MODELS.map(m => `
    <div class="cloud-model ${m.id === selectedCloudModel ? 'active' : ''}" onclick="selectCloudModel('${m.id}')">
      <span>${m.name}</span>
      <span class="speed">${m.speed}</span>
      <div style="font-size:.65rem;color:var(--text);margin-top:.1rem">${m.desc}</div>
    </div>
  `).join('');
}

function selectCloudModel(id) {
  selectedCloudModel = id;
  renderCloudModels();
  const model = CLOUD_MODELS.find(m => m.id === id);
  document.getElementById('inputHint').textContent = `☁️ ${model.name} · ${model.desc} · HF 免费推理`;
}

function switchBackend(type, btn) {
  backend = type;
  document.querySelectorAll('.backend-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('cloudPanel').style.display = type === 'cloud' ? 'block' : 'none';
  document.getElementById('localPanel').style.display = type === 'local' ? 'block' : 'none';

  if (type === 'cloud') {
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('statusText').textContent = 'HF Cloud';
    document.getElementById('inputHint').textContent = '☁️ 云端免费模型 · 无需部署 · 即开即用';
  } else {
    document.getElementById('statusDot').className = 'status-dot offline';
    document.getElementById('statusText').textContent = '未连接';
    document.getElementById('inputHint').textContent = '💻 连接本地 llama-server 服务';
  }
}

// ============ Local Health Check ============
async function checkLocalHealth() {
  localServerUrl = document.getElementById('serverUrl').value.replace(/\/$/, '');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  try {
    const r = await fetch(localServerUrl + '/health', { signal: AbortSignal.timeout(5000) });
    const j = await r.json();
    if (j.status === 'ok' || j.ok) {
      dot.className = 'status-dot online';
      text.textContent = '已连接';
      try {
        const mr = await fetch(localServerUrl + '/v1/models');
        const mj = await mr.json();
        const sel = document.getElementById('modelSelect');
        const models = mj.data || mj.models || [];
        sel.innerHTML = models.map(m => `<option value="${m.id || m.name}">${m.id || m.name}</option>`).join('');
      } catch(e) {}
    } else {
      dot.className = 'status-dot offline';
      text.textContent = '服务异常';
    }
  } catch(e) {
    dot.className = 'status-dot offline';
    text.textContent = '连接失败';
  }
}

// ============ Chat ============
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function scrollToBottom() { document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }
function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addMessage(role, content, meta) {
  const welcome = document.querySelector('.welcome');
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-bubble">${escapeHtml(content)}</div>${meta ? `<div class="msg-meta">${meta}</div>` : ''}`;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingMsg';
  div.innerHTML = '<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
  return div;
}

function newChat() {
  messages = [];
  document.getElementById('messages').innerHTML = `
    <div class="welcome">
      <h2>🎮 PowerAuto Playground</h2>
      <p>选择云端免费模型或连接本地服务，实时体验大模型对话。</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('用一句话介绍你自己')">👋 自我介绍</button>
        <button class="quick-btn" onclick="sendQuick('写一个 Python 快速排序算法')">💻 写代码</button>
        <button class="quick-btn" onclick="sendQuick('解释什么是 MoE 架构')">📚 解释概念</button>
      </div>
    </div>`;
  document.getElementById('tokenStats').style.display = 'none';
}
function clearChat() { newChat(); }
function sendQuick(text) { document.getElementById('userInput').value = text; sendMessage(); }

// ============ Send Message ============
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isGenerating) return;
  input.value = '';
  input.style.height = 'auto';
  isGenerating = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  const typingDiv = addTyping();

  const systemPrompt = document.getElementById('systemPrompt').value;
  const fullMessages = [{ role: 'system', content: systemPrompt }, ...messages];

  const t0 = Date.now();

  try {
    if (backend === 'cloud') {
      await sendCloud(typingDiv, fullMessages, t0);
    } else {
      await sendLocal(typingDiv, fullMessages, t0);
    }
  } catch(e) {
    typingDiv.remove();
    addMessage('assistant', `❌ 错误: ${e.message}`);
  }

  isGenerating = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// ============ Cloud (HuggingFace Inference API) ============
async function sendCloud(typingDiv, fullMessages, t0) {
  const modelId = selectedCloudModel;
  const maxTokens = parseInt(document.getElementById('maxTokens').value);
  const temperature = parseFloat(document.getElementById('temp').value);

  // HuggingFace Inference API (free tier)
  const API_URL = `https://api-inference.huggingface.co/models/${modelId}`;

  const payload = {
    inputs: formatMessages(fullMessages),
    parameters: {
      max_new_tokens: maxTokens,
      temperature: temperature,
      top_p: parseFloat(document.getElementById('topP').value),
      return_full_text: false,
    }
  };

  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`HF API ${resp.status}: ${err.substring(0, 200)}`);
  }

  const data = await resp.json();
  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

  let content = '';
  if (Array.isArray(data)) {
    content = data[0]?.generated_text || data[0]?.text || JSON.stringify(data[0]);
  } else if (data.generated_text) {
    content = data.generated_text;
  } else {
    content = JSON.stringify(data);
  }

  // Clean up: remove the input prompt from output if model echoes it
  const lastUserMsg = fullMessages[fullMessages.length - 1].content;
  if (content.startsWith(lastUserMsg)) {
    content = content.substring(lastUserMsg.length).trim();
  }

  typingDiv.remove();
  const model = CLOUD_MODELS.find(m => m.id === modelId);
  addMessage('assistant', content || '(空响应)', `${elapsed}s · ☁️ ${model?.name || modelId}`);

  document.getElementById('tokenStats').style.display = 'flex';
  document.getElementById('statTime').textContent = elapsed + 's';
  document.getElementById('statTps').textContent = '~';
  document.getElementById('statPrompt').textContent = '~';
  document.getElementById('statCompletion').textContent = content.split(/\s+/).length;

  messages.push({ role: 'assistant', content });
}

function formatMessages(messages) {
  // Convert chat messages to a single prompt for HF Inference API
  let prompt = '';
  for (const msg of messages) {
    if (msg.role === 'system') {
      prompt += `<|system|>\n${msg.content}\n`;
    } else if (msg.role === 'user') {
      prompt += `<|user|>\n${msg.content}\n`;
    } else if (msg.role === 'assistant') {
      prompt += `<|assistant|>\n${msg.content}\n`;
    }
  }
  prompt += '<|assistant|>\n';
  return prompt;
}

// ============ Local (llama-server OpenAI API) ============
async function sendLocal(typingDiv, fullMessages, t0) {
  if (!localServerUrl) {
    typingDiv.remove();
    addMessage('assistant', '请先在左侧输入本地服务地址并点击"连接"');
    return;
  }

  const body = {
    model: document.getElementById('modelSelect').value || 'local',
    messages: fullMessages,
    max_tokens: parseInt(document.getElementById('maxTokens').value),
    temperature: parseFloat(document.getElementById('temp').value),
    top_p: parseFloat(document.getElementById('topP').value),
    stream: true,
  };

  const resp = await fetch(localServerUrl + '/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  let buffer = '';
  typingDiv.querySelector('.msg-bubble').innerHTML = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            typingDiv.querySelector('.msg-bubble').textContent = fullText;
            scrollToBottom();
          }
        } catch(e) {}
      }
    }
  }

  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
  typingDiv.remove();
  addMessage('assistant', fullText || '(空响应)', `${elapsed}s · 💻 Local`);

  messages.push({ role: 'assistant', content: fullText });
}

// ============ Init ============
init();
document.getElementById('statusDot').className = 'status-dot online';
document.getElementById('statusText').textContent = 'HF Cloud';
